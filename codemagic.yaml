workflows:
  ios-build:
    name: Flutter iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.44.8
      xcode: 16.2
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
