name: Build Flutter iOS Simulator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # ۵. ساخت خروجی مخصوص شبیه‌ساز (Simulator)
      - name: Build iOS Simulator App
        run: flutter build ios --simulator --no-codesign

      # ۶. زیپ کردن پوشه Runner.app برای Appetize
      - name: Zip Simulator App
        run: |
          cd build/ios/iphonesimulator
          zip -r runner-simulator.zip Runner.app

      # ۷. آپلود فایل زیپ شده
      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/runner-simulator.zip